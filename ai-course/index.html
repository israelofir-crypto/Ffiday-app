      --bg: #0f1a1f; --surface: #16252c; --surface-2: #1b2d35; --line: #2a3f48;
      --ink: #e4eef1; --muted: #93a8b0; --accent: #3cc2b4; --accent-ink: #062321;
      --accent-soft: #173b3a; --planned: #8fa3ab; --progress: #e3a13e; --done: #5cc27f;
      --danger: #e27272; --fin: #7fb2ec; --fin-soft: #1a2f45;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0f1a1f; --surface: #16252c; --surface-2: #1b2d35; --line: #2a3f48;
    --ink: #e4eef1; --muted: #93a8b0; --accent: #3cc2b4; --accent-ink: #062321;
    --accent-soft: #173b3a; --planned: #8fa3ab; --progress: #e3a13e; --done: #5cc27f;
    --danger: #e27272; --fin: #7fb2ec; --fin-soft: #1a2f45;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    background: var(--bg); color: var(--ink);
    font: 15px/1.6 "Heebo", "Segoe UI", Arial, sans-serif;
    padding-inline: 16px; padding-block: 28px 48px;
  }
  .wrap { max-width: 1080px; margin-inline: auto; display: grid; gap: 20px; }
  h1, h2, h3 { font-family: "Rubik", "Heebo", sans-serif; margin: 0; text-wrap: balance; }
  h1 { font-size: 1.9rem; letter-spacing: -.01em; }
  h2 { font-size: 1.1rem; }
  .num { font-family: "IBM Plex Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  ul { margin: 0; padding-inline-start: 1.2em; }
  li + li { margin-top: 3px; }

  .top { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 16px; }
  .top p { margin: 4px 0 0; color: var(--muted); }
  .sync { font-size: .82rem; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .sync i { width: 8px; height: 8px; border-radius: 50%; background: var(--planned); display: inline-block; }
  .sync.on i { background: var(--done); }

  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .tab {
    background: none; color: var(--muted); border: 0; border-bottom: 3px solid transparent;
    border-radius: 0; padding: 8px 14px; font-weight: 600;
  }
  .tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
  .tab:hover { filter: none; color: var(--ink); }

  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 18px 20px; }
  .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
  .stat { display: grid; gap: 2px; }
  .stat b { font-size: 1.7rem; line-height: 1.1; }
  .stat span { color: var(--muted); font-size: .85rem; }
  .stat.planned b { color: var(--planned); } .stat.progress b { color: var(--progress); } .stat.done b { color: var(--done); }
  .meter { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: var(--surface-2); margin-top: 16px; }
  .meter div { transition: width .35s ease; }
  .topics { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }

  .cols { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 20px; align-items: start; }
  .side { display: grid; gap: 20px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); }

  .filters { display: grid; grid-template-columns: 2fr repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
  input, select, textarea {
    font: inherit; color: var(--ink); background: var(--surface);
    border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; width: 100%;
  }
  textarea { resize: vertical; min-height: 64px; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  label { display: grid; gap: 4px; font-size: .82rem; color: var(--muted); }

  button {
    font: inherit; font-weight: 600; cursor: pointer; border: 1px solid transparent;
    border-radius: 10px; padding: 9px 14px; background: var(--accent); color: var(--accent-ink);
  }
  button:hover { filter: brightness(1.08); }
  button.quiet { background: transparent; color: var(--muted); border-color: var(--line); padding: 5px 10px; font-size: .85rem; }
  button.quiet:hover { color: var(--ink); }
  button.danger { background: var(--danger); color: #fff; padding: 5px 10px; font-size: .85rem; }
  button.link { background: none; color: var(--accent); padding: 0; border: 0; text-align: start; }
  button.link:hover { text-decoration: underline; filter: none; }
  button:disabled { opacity: .5; cursor: default; }

  .list { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
  .course {
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
    padding: 14px 16px; display: grid; gap: 8px; align-content: start;
    border-inline-start: 4px solid var(--c, var(--planned));
  }
  .course h3 { font-size: 1rem; font-weight: 500; }
  .course h3 a { color: inherit; text-decoration: none; }
  .course h3 a:hover { color: var(--accent); text-decoration: underline; }
  .course .by { color: var(--muted); font-size: .85rem; }
  .course .notes { margin: 0; font-size: .88rem; color: var(--muted); }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; }
  .chip { background: var(--surface-2); border: 1px solid var(--line); color: var(--muted); border-radius: 999px; padding: 1px 9px; font-size: .78rem; }
  .chip.topic { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
  .chip.fin { background: var(--fin-soft); color: var(--fin); border-color: transparent; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .course .row select { flex: 1; padding: 5px 9px; font-size: .88rem; }
  .rec { display: grid; gap: 2px; background: var(--surface-2); border-radius: 8px; padding: 6px 10px; font-size: .88rem; }
  .stars { color: var(--progress); letter-spacing: .1em; }
  .example-tag { font-size: .72rem; letter-spacing: .06em; color: var(--muted); border: 1px dashed var(--line); border-radius: 6px; padding: 0 6px; justify-self: start; }
  .course.example { opacity: .75; }
  .note { color: var(--muted); font-size: .9rem; margin: 0 0 12px; }

  form { display: grid; gap: 10px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .msg { font-size: .85rem; min-height: 1.2em; margin: 0; }
  .msg.err { color: var(--danger); } .msg.ok { color: var(--done); }
  .links { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .links a { text-decoration: none; color: var(--accent); background: var(--accent-soft); padding: 5px 11px; border-radius: 8px; font-size: .88rem; font-weight: 500; }
  .links a:hover { text-decoration: underline; }

  /* Detail */
  .d-head { display: grid; gap: 10px; }
  .d-head h2 { font-size: 1.5rem; }
  .d-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px 18px; margin: 0; }
  .d-grid div { display: grid; gap: 1px; }
  .d-grid dt { font-size: .76rem; color: var(--muted); letter-spacing: .04em; }
  .d-grid dd { margin: 0; font-weight: 500; }
  .caveat { background: var(--surface-2); border: 1px dashed var(--line); border-radius: 10px; padding: 8px 12px; font-size: .88rem; color: var(--muted); margin: 0; }
  .split { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .outcomes li::marker { color: var(--fin); }
  .pros li::marker { color: var(--done); }
  .cons li::marker { color: var(--danger); }

  .hours { display: grid; gap: 6px; margin-top: 12px; }
  .hrow { display: grid; grid-template-columns: minmax(120px, 220px) 1fr 44px; gap: 10px; align-items: center; font-size: .86rem; }
  .hrow .lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hbar { height: 14px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
  .hbar div { height: 100%; border-radius: 4px; }
  .hrow .num { text-align: end; color: var(--muted); }
  .legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: .8rem; color: var(--muted); margin-top: 10px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-inline-end: 5px; vertical-align: -1px; }

  .mods { display: grid; gap: 10px; }
  details.mod { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
  details.mod summary {
    list-style: none; cursor: pointer; padding: 12px 16px;
    display: grid; grid-template-columns: auto 1fr auto auto; gap: 12px; align-items: center;
  }
  details.mod summary::-webkit-details-marker { display: none; }
  details.mod summary .idx { font-family: "IBM Plex Mono", monospace; color: var(--muted); font-size: .85rem; min-width: 1.6em; }
  details.mod summary .t { font-weight: 600; }
  details.mod summary .h { font-size: .8rem; color: var(--muted); }
  details.mod summary .chev { color: var(--muted); transition: transform .2s; }
  details.mod[open] summary .chev { transform: rotate(-90deg); }
  .mod-body { padding: 0 16px 16px; display: grid; gap: 12px; }
  .mod-body h4 { margin: 0 0 4px; font-size: .82rem; color: var(--muted); font-weight: 600; letter-spacing: .03em; }
  .fin-box { background: var(--fin-soft); border-radius: 10px; padding: 10px 14px; border-inline-start: 3px solid var(--fin); }
  .fin-box h4 { color: var(--fin); }
  .fin-box p { margin: 0; }
  .rel { display: inline-flex; gap: 3px; align-items: center; font-size: .78rem; color: var(--fin); white-space: nowrap; }
  .rel i { width: 8px; height: 8px; border-radius: 50%; background: var(--line); display: inline-block; }
  .rel i.on { background: var(--fin); }

  /* Finance matrix */
  .tbl-wrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; min-width: 620px; font-size: .9rem; }
  th, td { padding: 9px 10px; border-bottom: 1px solid var(--line); text-align: start; vertical-align: top; }
  th { font-size: .8rem; color: var(--muted); font-weight: 600; }
  td.lvl { text-align: center; font-size: 1.05rem; width: 72px; }
  th.lvl { text-align: center; }
  .dot { display: inline-block; width: 14px; height: 14px; border-radius: 50%; vertical-align: -2px; }
  .dot.d2 { background: var(--fin); }
  .dot.d1 { border: 2px solid var(--progress); background: linear-gradient(to left, var(--progress) 50%, transparent 50%); }
  .dot.d0 { width: 12px; height: 2px; border-radius: 1px; background: var(--line); vertical-align: 3px; }
  td .sub { display: block; font-size: .78rem; color: var(--muted); margin-top: 2px; }
  .score-bars { display: grid; gap: 8px; margin-top: 12px; }

  @media (max-width: 860px) {
    .cols { grid-template-columns: 1fr; }
    .side { position: static; }
    .split { grid-template-columns: 1fr; }
  }
  @media (max-width: 560px) {
    .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .filters { grid-template-columns: 1fr 1fr; }
    .filters #q { grid-column: 1 / -1; }
    .two { grid-template-columns: 1fr; }
    .hrow { grid-template-columns: 1fr 44px; }
    .hrow .hbar { grid-column: 1 / -1; grid-row: 2; }
    details.mod summary { grid-template-columns: auto 1fr auto; }
    details.mod summary .h { grid-column: 2; }
  }
  @media (prefers-reduced-motion: reduce) { .meter div, details.mod summary .chev { transition: none; } }
</style>

<div class="wrap" dir="rtl" lang="he">
  <header class="top">
    <div>
      <h1>קורס AI</h1>
      <p>קורסי הבינה המלאכותית שבחרתי, עם פירוק לעומק ודוגמאות ממחלקת הכספים</p>
    </div>
    <div class="sync" id="sync"><i></i><span>נשמר בדפדפן הזה</span></div>
  </header>

  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-list" aria-selected="true">הקורסים</button>
    <button class="tab" role="tab" id="tab-fin" aria-selected="false">עדשת כספים</button>
  </nav>

  <!-- List view -->
  <div id="view-list" class="wrap" style="max-width:none">
    <section class="panel" aria-label="סיכום">
      <div class="stats">
        <div class="stat"><b class="num" id="s-total">0</b><span>קורסים</span></div>
        <div class="stat planned"><b class="num" id="s-planned">0</b><span>מתוכננים</span></div>
        <div class="stat progress"><b class="num" id="s-progress">0</b><span>בלמידה</span></div>
        <div class="stat done"><b class="num" id="s-done">0</b><span>הושלמו</span></div>
      </div>
      <div class="meter" id="meter" aria-hidden="true"></div>
      <div class="topics" id="topic-chips"></div>
    </section>

    <div class="cols">
      <main>
        <div class="filters">
          <input id="q" type="search" placeholder="חיפוש בקורסים, בנושאים ובדוגמאות" aria-label="חיפוש">
          <select id="f-topic" aria-label="נושא"><option value="">כל הנושאים</option></select>
          <select id="f-level" aria-label="רמה">
            <option value="">כל הרמות</option><option>מתחילים</option><option>בינוני</option><option>מתקדמים</option>
          </select>
          <select id="f-status" aria-label="סטטוס">
            <option value="">כל הסטטוסים</option><option>מתוכנן</option><option>בלמידה</option><option>הושלם</option>
          </select>
        </div>
        <p class="note" id="list-note" hidden></p>
        <div class="list" id="list"></div>
      </main>

      <aside class="side">
        <section class="panel">
          <h2>הוספת קורס</h2>
          <form id="add-form" style="margin-top:12px">
            <label>שם הקורס<input id="a-title" required></label>
            <div class="two">
              <label>פלטפורמה<input id="a-provider" placeholder="Coursera, YouTube…"></label>
              <label>נושא<input id="a-topic" list="topic-list" placeholder="LLM, פרומפטים…"></label>
            </div>
            <label>קישור<input id="a-url" type="url" placeholder="https://" dir="ltr"></label>
            <div class="two">
              <label>רמה<select id="a-level"><option>מתחילים</option><option>בינוני</option><option>מתקדמים</option></select></label>
              <label>שפה<select id="a-language"><option>עברית</option><option>אנגלית</option><option>אחר</option></select></label>
            </div>
            <label>סטטוס<select id="a-status"><option>מתוכנן</option><option>בלמידה</option><option>הושלם</option></select></label>
            <label>הערות<textarea id="a-notes"></textarea></label>
            <button type="submit" id="a-submit">שמירת קורס</button>
            <p class="msg" id="a-msg" role="status"></p>
          </form>
          <datalist id="topic-list"></datalist>
        </section>

        <section class="panel">
          <h2>חיפוש קורסים חדשים</h2>
          <input id="ext-q" style="margin-top:10px" placeholder="למשל: AI לכספים, Power BI, סוכנים" aria-label="נושא לחיפוש">

  <!-- Detail view -->

<script>
const STATUSES = ["מתוכנן", "בלמידה", "הושלם"];
const STATUS_COLOR = { "מתוכנן": "var(--planned)", "בלמידה": "var(--progress)", "הושלם": "var(--done)" };
const REL_LABEL = { 1: "רלוונטיות נמוכה לכספים", 2: "רלוונטיות בינונית לכספים", 3: "רלוונטיות גבוהה לכספים" };
const REL_COLOR = { 1: "var(--planned)", 2: "var(--progress)", 3: "var(--fin)" };
const EXAMPLES = [
  { id: "ex1", title: "Prompt Engineering למתחילים", provider: "YouTube", topic: "פרומפטים", level: "מתחילים", language: "עברית", status: "בלמידה", score: 5, why: "בסיס חובה לכל עבודה עם AI, קצר ומעשי" },
  { id: "ex2", title: "Building with the Claude API", provider: "Anthropic", topic: "LLM", level: "בינוני", language: "אנגלית", status: "מתוכנן" }
];

let db = null, courses = [], finance = null, loaded = false, pendingDelete = null, view = "list", detailId = null;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const safeUrl = u => /^https?:\/\//i.test(u || "") ? u : "";
const stars = n => { n = Math.max(0, Math.min(5, Number(n) || 0)); return "★".repeat(n) + "☆".repeat(5 - n); };
const rel = n => `<span class="rel" title="${REL_LABEL[n] || ""}">${[1, 2, 3].map(i => `<i class="${i <= n ? "on" : ""}"></i>`).join("")}</span>`;

function setSync(on, text) {
  $("sync").className = "sync" + (on ? " on" : "");
  $("sync").querySelector("span").textContent = text;
}

function show(v, id) {
  view = v; detailId = id || null;
  $("view-list").hidden = v !== "list";
  $("view-detail").hidden = v !== "detail";
  $("view-fin").hidden = v !== "fin";
  $("tab-list").setAttribute("aria-selected", String(v === "list" || v === "detail"));
  $("tab-fin").setAttribute("aria-selected", String(v === "fin"));
  try { history.replaceState(null, "", v === "detail" ? "#" + id : v === "fin" ? "#finance" : "#"); } catch (e) {}
  renderAll();
  window.scrollTo({ top: 0 });
}
$("tab-list").addEventListener("click", () => show("list"));
$("tab-fin").addEventListener("click", () => show("fin"));

function renderAll() {
  if (view === "list") renderList();
  else if (view === "detail") renderDetail();
  else renderFinance();
}

/* ---------- List ---------- */
function renderList() {
  const isExample = loaded && courses.length === 0;
  const data = isExample ? EXAMPLES : courses;
  const count = s => data.filter(c => c.status === s).length;
  const total = data.length, p = count("מתוכנן"), g = count("בלמידה"), d = count("הושלם");
  $("s-total").textContent = total; $("s-planned").textContent = p;
  $("s-progress").textContent = g; $("s-done").textContent = d;
  $("meter").innerHTML = total ? [[d, "var(--done)"], [g, "var(--progress)"], [p, "var(--planned)"]]
    .map(([n, c]) => `<div style="width:${n / total * 100}%;background:${c}"></div>`).join("") : "";

  const byTopic = {};
  data.forEach(c => { if (c.topic) byTopic[c.topic] = (byTopic[c.topic] || 0) + 1; });
  const topics = Object.keys(byTopic).sort();
  $("topic-chips").innerHTML = topics.map(t => `<span class="chip topic">${esc(t)} · <span class="num">${byTopic[t]}</span></span>`).join("");
  const ft = $("f-topic").value;
  $("f-topic").innerHTML = `<option value="">כל הנושאים</option>` + topics.map(t => `<option ${t === ft ? "selected" : ""}>${esc(t)}</option>`).join("");
  $("topic-list").innerHTML = topics.map(t => `<option value="${esc(t)}">`).join("");

  const q = $("q").value.trim().toLowerCase(), fl = $("f-level").value, fs = $("f-status").value;
  const haystack = c => [c.title, c.provider, c.topic, c.notes, c.why,
    ...(c.modules || []).flatMap(m => [m.name, m.example, ...(m.learn || [])])].join(" ").toLowerCase();
  const shown = data.filter(c => (!ft || c.topic === ft) && (!fl || c.level === fl) && (!fs || c.status === fs) && (!q || haystack(c).includes(q)))
    .sort((a, b) => (b.score || 0) - (a.score || 0));

  const note = $("list-note");
  if (!loaded) { note.hidden = false; note.textContent = "טוען את הרשימה…"; }
  else if (isExample) { note.hidden = false; note.textContent = "הרשימה עדיין ריקה. אלה קורסים לדוגמה בלבד."; }
  else if (!shown.length) { note.hidden = false; note.textContent = "אין קורסים שמתאימים לסינון."; }
  else note.hidden = true;

  $("list").innerHTML = shown.map(c => {
    const url = safeUrl(c.url);
    const title = url ? `<a href="${esc(url)}" target="_blank" rel="noopener">${esc(c.title)} ↗</a>` : esc(c.title);
    const mods = c.modules || [];
    const hot = mods.filter(m => m.finance === 3).length;
    const controls = isExample ? `<span class="example-tag">דוגמה</span>` :
      pendingDelete === c.id
        ? `<div class="row"><span style="font-size:.85rem">להסיר?</span><button class="danger" data-confirm="${esc(c.id)}">הסרה</button><button class="quiet" data-cancel>ביטול</button></div>`
        : `<div class="row"><select data-status="${esc(c.id)}" aria-label="סטטוס">${STATUSES.map(s => `<option ${s === c.status ? "selected" : ""}>${s}</option>`).join("")}</select><button class="quiet" data-remove="${esc(c.id)}">הסרה</button></div>`;
    return `<article class="course${isExample ? " example" : ""}" style="--c:${STATUS_COLOR[c.status] || "var(--planned)"}">
      <h3>${title}</h3>
      ${c.provider ? `<div class="by">${esc(c.provider)}</div>` : ""}
      <div class="chips">
        ${c.topic ? `<span class="chip topic">${esc(c.topic)}</span>` : ""}
        ${c.level ? `<span class="chip">${esc(c.level)}</span>` : ""}
        ${mods.length ? `<span class="chip">${mods.length} נושאים</span>` : ""}
        ${hot ? `<span class="chip fin">${hot} רלוונטיים מאוד לכספים</span>` : ""}
      </div>
      ${c.score ? `<div class="rec"><span class="stars" aria-label="ציון התאמה ${Number(c.score)} מתוך 5">${stars(c.score)}</span>${c.why ? `<span>${esc(c.why)}</span>` : ""}</div>` : ""}
      ${c.notes ? `<p class="notes">${esc(c.notes)}</p>` : ""}
      ${mods.length ? `<button class="link" data-open="${esc(c.id)}">לפירוט המלא ולדוגמאות מהכספים ←</button>` : ""}
      ${controls}
    </article>`;
  }).join("");
}

["q", "f-topic", "f-level", "f-status"].forEach(id => $(id).addEventListener("input", renderList));

$("list").addEventListener("change", async e => {
  const id = e.target.dataset.status;
  if (!id || !db) return;
  try { await db.doc("courses/" + id).update({ status: e.target.value }); }
  catch { setSync(false, "השינוי לא נשמר. נסה שוב"); }
});
$("list").addEventListener("click", async e => {
  const t = e.target.closest("button");
  if (!t) return;
  if (t.dataset.open) show("detail", t.dataset.open);
  else if (t.dataset.remove) { pendingDelete = t.dataset.remove; renderList(); }
  else if (t.hasAttribute("data-cancel")) { pendingDelete = null; renderList(); }
  else if (t.dataset.confirm && db) {
    const id = t.dataset.confirm; pendingDelete = null;
    try { await db.doc("courses/" + id).delete(); } catch { setSync(false, "ההסרה לא נשמרה. נסה שוב"); }
  }
});

/* ---------- Detail ---------- */
function renderDetail() {
  const c = courses.find(x => x.id === detailId);
  const el = $("view-detail");
  if (!c) { el.innerHTML = `<button class="quiet" data-back>→ חזרה לקורסים</button><p class="note">${loaded ? "הקורס לא נמצא." : "טוען…"}</p>`; return; }
  const f = c.facts || {};
  const mods = c.modules || [];
  const withHours = mods.filter(m => m.hours);
  const maxH = Math.max(1, ...withHours.map(m => m.hours));
  const totalH = withHours.reduce((s, m) => s + m.hours, 0);
  const finH = withHours.filter(m => m.finance === 3).reduce((s, m) => s + m.hours, 0);
  const relCount = n => mods.filter(m => m.finance === n).length;

  const factRows = [["היקף", f.hours], ["משך", f.duration], ["פתיחה", f.start], ["מועד", f.schedule],
    ["מתכונת", f.format], ["עלות", f.price], ["תעודה", f.cert], ["תנאי קבלה", f.prereq]]
    .filter(([, v]) => v).map(([k, v]) => `<div><dt>${k}</dt><dd>${esc(v)}</dd></div>`).join("");

  const chart = withHours.length ? `
    <section class="panel">
      <h2>איך מתחלקות השעות</h2>
      <p class="note" style="margin:4px 0 0"><span class="num">${finH}</span> מתוך <span class="num">${totalH}</span> שעות (${Math.round(finH / totalH * 100)}%) הן בנושאים עם רלוונטיות גבוהה לכספים</p>
      <div class="hours">${withHours.map(m => `
        <div class="hrow"><span class="lbl" title="${esc(m.name)}">${esc(m.name)}</span>
          <div class="hbar"><div style="width:${m.hours / maxH * 100}%;background:${REL_COLOR[m.finance] || "var(--planned)"}"></div></div>
          <span class="num">${m.hours}</span></div>`).join("")}</div>
      <div class="legend"><span><i style="background:var(--fin)"></i>רלוונטיות גבוהה לכספים</span><span><i style="background:var(--progress)"></i>בינונית</span><span><i style="background:var(--planned)"></i>נמוכה</span></div>
    </section>` : mods.length ? `
    <section class="panel">
      <h2>רלוונטיות הנושאים לכספים</h2>
      <p class="note" style="margin:4px 0 0">בחוברת אין חלוקת שעות לפי נושא, אז זו ספירה של הנושאים</p>
      <div class="hours">${[3, 2, 1].map(n => `
        <div class="hrow"><span class="lbl">${REL_LABEL[n].replace(" לכספים", "")}</span>
          <div class="hbar"><div style="width:${relCount(n) / mods.length * 100}%;background:${REL_COLOR[n]}"></div></div>
          <span class="num">${relCount(n)}</span></div>`).join("")}</div>
    </section>` : "";

  el.innerHTML = `
    <div><button class="quiet" data-back>→ חזרה לקורסים</button></div>
    <section class="panel d-head">
      <div class="chips">${c.topic ? `<span class="chip topic">${esc(c.topic)}</span>` : ""}${c.level ? `<span class="chip">${esc(c.level)}</span>` : ""}${c.language ? `<span class="chip">${esc(c.language)}</span>` : ""}</div>
      <h2>${esc(c.title)}</h2>
      <div class="by" style="color:var(--muted)">${esc(c.provider)}</div>
      ${c.score ? `<div class="rec"><span class="stars">${stars(c.score)} <span style="color:var(--muted);letter-spacing:0">ציון התאמה</span></span><span>${esc(c.why)}</span></div>` : ""}
      ${factRows ? `<dl class="d-grid">${factRows}</dl>` : ""}
      ${c.inferred ? `<p class="caveat">החומר של הקורס הזה מפרט רק את שמות הנושאים. את התוכן והדוגמאות בכל נושא כתבתי לפי השם, וכדאי לאמת מול הסילבוס המלא.</p>` : ""}
    </section>

    ${c.financeOutcomes ? `<section class="panel"><h2>מה תדע לעשות במחלקת הכספים בסוף הקורס</h2><ul class="outcomes" style="margin-top:10px">${c.financeOutcomes.map(x => `<li>${esc(x)}</li>`).join("")}</ul></section>` : ""}

    ${chart}

    ${mods.length ? `<section class="d-head">
      <div class="row" style="justify-content:space-between"><h2>הנושאים, אחד אחד</h2>
        <div class="row"><button class="quiet" data-expand="1">לפתוח הכול</button><button class="quiet" data-expand="0">לסגור הכול</button></div></div>
      <div class="mods">${mods.map((m, i) => `
        <details class="mod"${i === 0 ? " open" : ""}>
          <summary><span class="idx">${i + 1}</span><span class="t">${esc(m.name)}</span>
            <span class="h">${m.hours ? `<span class="num">${m.hours}</span> שעות · ` : ""}${rel(m.finance)}</span><span class="chev" aria-hidden="true">‹</span></summary>
          <div class="mod-body">
            <div><h4>מה לומדים</h4><ul>${(m.learn || []).map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>
            ${m.example ? `<div class="fin-box"><h4>דוגמה ממחלקת הכספים</h4><p>${esc(m.example)}</p></div>` : ""}
          </div>
        </details>`).join("")}</div>
    </section>` : ""}

    ${c.tools ? `<section class="panel"><h2>הכלים שנלמדים</h2><div class="chips" style="margin-top:10px">${c.tools.map(t => `<span class="chip">${esc(t)}</span>`).join("")}</div></section>` : ""}

    ${c.pros || c.cons ? `<section class="panel split">
      <div><h2>בעד</h2><ul class="pros" style="margin-top:8px">${(c.pros || []).map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>
      <div><h2>נגד</h2><ul class="cons" style="margin-top:8px">${(c.cons || []).map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>
    </section>` : ""}
  `;
}
$("view-detail").addEventListener("click", e => {
  const t = e.target.closest("button");
  if (!t) return;
  if (t.hasAttribute("data-back")) show("list");
  else if (t.dataset.expand) $("view-detail").querySelectorAll("details.mod").forEach(d => d.open = t.dataset.expand === "1");
});

/* ---------- Finance lens ---------- */
function renderFinance() {
  const el = $("view-fin");
  if (!finance) { el.innerHTML = `<p class="note">${loaded ? "עוד אין השוואת כספים." : "טוען…"}</p>`; return; }
  const cols = finance.courses || [], rows = finance.rows || [];
  const sym = n => `<span class="dot d${n}" title="${n === 2 ? "נלמד לעומק" : n === 1 ? "נלמד חלקית" : "לא נלמד"}"></span>`;
  const totals = cols.map((c, i) => rows.reduce((s, r) => s + (r.levels[i] || 0), 0));
  const max = Math.max(1, ...totals);
  const finHours = cols.map(c => {
    const course = courses.find(x => x.id === c.id);
    const mods = (course && course.modules) || [];
    return { hot: mods.filter(m => m.finance === 3).length, all: mods.length };
  });

  el.innerHTML = `
    <section class="panel">
      <h2>מי מלמד מה שמחלקת כספים צריכה</h2>
      <p class="note" style="margin:4px 0 12px">${sym(2)} נלמד לעומק &nbsp; ${sym(1)} נלמד חלקית &nbsp; ${sym(0)} לא נלמד · הדירוג שלי, לפי הסילבוסים שצירפת</p>
      <div class="tbl-wrap"><table>
        <thead><tr><th>משימה בכספים</th>${cols.map(c => `<th class="lvl"><button class="link" data-open="${esc(c.id)}">${esc(c.short)}</button></th>`).join("")}</tr></thead>
        <tbody>${rows.map(r => `<tr><td>${esc(r.useCase)}<span class="sub">${esc(r.note)}</span></td>${r.levels.map(l => `<td class="lvl">${sym(l)}</td>`).join("")}</tr>`).join("")}</tbody>
      </table></div>
    </section>
    <section class="panel">
      <h2>ציון כספים מצטבר</h2>
      <p class="note" style="margin:4px 0 0">סכום הנקודות בטבלה (לעומק = 2, חלקית = 1), ומספר הנושאים בכל קורס שהרלוונטיות שלהם לכספים גבוהה</p>
      <div class="score-bars">${cols.map((c, i) => `
        <div class="hrow"><span class="lbl">${esc(c.short)}</span>
          <div class="hbar"><div style="width:${totals[i] / max * 100}%;background:var(--fin)"></div></div>
          <span class="num">${totals[i]}</span></div>
        <div class="note" style="margin:-4px 0 4px;font-size:.8rem">${finHours[i].hot} מתוך ${finHours[i].all} נושאים ברלוונטיות גבוהה לכספים</div>`).join("")}</div>
    </section>`;
}
$("view-fin").addEventListener("click", e => {
  const t = e.target.closest("button[data-open]");
  if (t) show("detail", t.dataset.open);
});

/* ---------- Add + external search ---------- */
$("add-form").addEventListener("submit", async e => {
  e.preventDefault();
  const msg = $("a-msg");
  if (!db) { msg.className = "msg err"; msg.textContent = "השמירה לא זמינה בתצוגה הזו."; return; }
  const v = id => $(id).value.trim();
  $("a-submit").disabled = true;
  try {
    await db.collection("courses").add({
      title: v("a-title"), provider: v("a-provider"), url: v("a-url"), topic: v("a-topic"),
      level: v("a-level"), language: v("a-language"), status: v("a-status"), notes: v("a-notes"),
      added: new Date().toISOString()
    });
    e.target.reset();
    msg.className = "msg ok"; msg.textContent = "הקורס נשמר";
  } catch (err) {
    msg.className = "msg err";
    msg.textContent = err && err.code === "quota_exceeded" ? "הגעת למגבלת הקורסים. הסר קורסים ישנים ונסה שוב." : "הקורס לא נשמר. נסה שוב בעוד רגע.";
  }
  $("a-submit").disabled = false;
});

const PROVIDERS = [
  ["Coursera", q => `https://www.coursera.org/search?query=${q}`],
  ["Udemy", q => `https://www.udemy.com/courses/search/?q=${q}`],
  ["YouTube", q => `https://www.youtube.com/results?search_query=${q}`],
  ["edX", q => `https://www.edx.org/search?q=${q}`],
  ["Google", q => `https://www.google.com/search?q=${q}`]
];
function renderExt() {
  const q = encodeURIComponent(($("ext-q").value.trim() || "AI for finance") + " course");
  $("ext-links").innerHTML = PROVIDERS.map(([n, f]) => `<a href="${f(q)}" target="_blank" rel="noopener">${n} ↗</a>`).join("");
}
$("ext-q").addEventListener("input", renderExt);

/* ---------- Boot ---------- */
(function initFromHash() {
  const h = (location.hash || "").slice(1);
  if (h === "finance") view = "fin";
  else if (h) { view = "detail"; detailId = h; }
  $("view-list").hidden = view !== "list";
  $("view-detail").hidden = view !== "detail";
  $("view-fin").hidden = view !== "fin";
  $("tab-list").setAttribute("aria-selected", String(view !== "fin"));
  $("tab-fin").setAttribute("aria-selected", String(view === "fin"));
})();
renderAll(); renderExt();

(async () => {
  db = window.claude ? await window.claude.use("db") : null;
  if (!db) { loaded = true; setSync(false, "תצוגה בלבד"); $("a-submit").disabled = true; renderAll(); return; }
  db.collection("courses").orderBy("added", "desc").onSnapshot(snap => {
    courses = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    loaded = true; setSync(true, "נשמר בדפדפן הזה"); renderAll();
  }, () => { loaded = true; setSync(false, "החיבור לרשימה נותק. רענן את הדף"); renderAll(); });
  db.doc("insights/finance").onSnapshot(s => { finance = s.exists ? s.data() : null; renderAll(); }, () => {});
})();
</script>

</body>
</html>
